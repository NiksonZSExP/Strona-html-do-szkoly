<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Formularz Rolski </title>

    <style>
        body {
            background-color: #252525;
            font-family: Arial, sans-serif;
            color: #333;
            margin: 0;
            padding: 30px 10px;
        }

        input, select, textarea, button {
            font-family: Arial, sans-serif;
        }

        @media (max-width: 550px) {
            .kolumny {
                grid-template-columns: 1fr !important;
            }

            .proby {
                grid-template-columns: 1fr !important;
            }
        }
    </style>
</head>

<body>

<A HREF="index.html"> Wróć </A> <br> <br>




<!-- FORMULARZ -->
     
<form id="formularz" style="
    background-color: #e8e6dc;
    max-width: 750px;
    margin: auto;
    padding: 25px;
    border: 1px solid #aaa;
    box-sizing: border-box;
">

    <!-- TYTUŁ -->
    <h1 style="text-align: center; font-size: 25px; font-weight: normal; margin: 0;">
        ZGŁOSZENIE DO ZESPOŁU METALOWEGO
        <span style="font-size: 20px;">🎸</span>
    </h1>

    <p style="text-align: center; font-style: italic; margin-bottom: 20px;">
        Formularz dla kandydatów
    </p>


    <!-- DANE OSOBOWE -->
    <section style="border: 1px solid #777; padding: 12px; margin-bottom: 14px;">

        <h2 style="font-size: 21px; font-weight: normal; margin-top: 0;">
            DANE OSOBOWE
        </h2>

        <div class="kolumny" style="
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 25px;
        ">

            <div>
                <label for="imie">Imię</label>
                <input type="text" id="imie" name="imie" required
                    style="width: 100%; padding: 8px; box-sizing: border-box; background: transparent;">
            </div>

            <div>
                <label for="nazwisko">Nazwisko</label>
                <input type="text" id="nazwisko" name="nazwisko" required
                    style="width: 100%; padding: 8px; box-sizing: border-box; background: transparent;">
            </div>

            <div>
                <label for="wiek">Wiek</label>
                <input type="number" id="wiek" name="wiek" min="1" max="120" required
                    style="width: 100%; padding: 8px; box-sizing: border-box; background: transparent;">
            </div>

            <div>
                <label for="miasto">Miasto</label>
                <input type="text" id="miasto" name="miasto" required
                    style="width: 100%; padding: 8px; box-sizing: border-box; background: transparent;">
            </div>

            <div>
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required
                    style="width: 100%; padding: 8px; box-sizing: border-box; background: transparent;">
            </div>

            <div>
                <label for="telefon">Numer telefonu</label>
                <input type="tel" id="telefon" name="telefon" required
                    style="width: 100%; padding: 8px; box-sizing: border-box; background: transparent;">
            </div>

        </div>
    </section>


    <!-- O TOBIE I MUZYCE -->
    <section style="border: 1px solid #777; padding: 12px; margin-bottom: 14px;">

        <h2 style="font-size: 21px; font-weight: normal; margin-top: 0;">
            O TOBIE I MUZYCE
        </h2>

        <p>Na czym grasz?</p>

        <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 12px;">

            <label>
                <input type="checkbox" name="instrument" value="Gitara">
                Gitara
            </label>

            <label>
                <input type="checkbox" name="instrument" value="Bas">
                Bas
            </label>

            <label>
                <input type="checkbox" name="instrument" value="Perkusja">
                Perkusja
            </label>

            <label>
                <input type="checkbox" name="instrument" value="Wokal">
                Wokal
            </label>

        </div>

        <div style="margin-top: 12px;">

            <label>
                <input type="checkbox" id="inne" name="instrument" value="Inne">
                Inne
            </label>

            <label for="inne-instrumenty">Jeśli inne, jakie?</label>

            <input type="text" id="inne-instrumenty" name="inne-instrumenty"
                style="width: 100%; padding: 8px; box-sizing: border-box; background: transparent;">

        </div>

        <p>Jakie gatunki lubisz i grasz? (metal)</p>

        <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 12px;">

            <label>
                <input type="checkbox" name="gatunek" value="Thrash">
                Thrash
            </label>

            <label>
                <input type="checkbox" name="gatunek" value="Groove">
                Groove
            </label>

            <label>
                <input type="checkbox" name="gatunek" value="Doom">
                Doom
            </label>

            <label>
                <input type="checkbox" name="gatunek" value="Death">
                Death
            </label>

        </div>

        <div style="margin-top: 12px;">

            <label for="inne-gatunki">Jeśli inne, jakie?</label>

            <input type="text" id="inne-gatunki" name="inne-gatunki"
                style="width: 100%; padding: 8px; box-sizing: border-box; background: transparent;">

        </div>
    </section>


    <!-- DOŚWIADCZENIE -->
    <section style="border: 1px solid #777; padding: 12px; margin-bottom: 14px;">

        <h2 style="font-size: 21px; font-weight: normal; margin-top: 0;">
            DOŚWIADCZENIE
        </h2>

        <p>Jak długo grasz?</p>

        <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 12px;">

            <label>
                <input type="radio" name="doswiadczenie"
                    value="Dopiero zaczynam" required>
                Dopiero zaczynam
            </label>

            <label>
                <input type="radio" name="doswiadczenie" value="1-3 lata">
                1–3 lata
            </label>

            <label>
                <input type="radio" name="doswiadczenie" value="Ponad 3 lata">
                Ponad 3 lata
            </label>

        </div>

        <p>Opisz swoje doświadczenie i inspiracje:</p>

        <textarea id="opis" name="opis" required
            style="
                width: 100%;
                height: 110px;
                padding: 8px;
                box-sizing: border-box;
                resize: vertical;
                background-color: transparent;
                background-image: repeating-linear-gradient(
                    to bottom,
                    transparent 0,
                    transparent 29px,
                    #b9b7ad 30px
                );
                line-height: 30px;
            "></textarea>

        <div style="margin-top: 10px;">

            <label for="nagranie">Link do nagrania</label>

            <input type="url" id="nagranie" name="nagranie"
                placeholder="(opcjonalnie)"
                style="width: 100%; padding: 8px; box-sizing: border-box; background: transparent;">

        </div>
    </section>


    <!-- PRÓBY -->
    <section style="border: 1px solid #777; padding: 12px; margin-bottom: 14px;">

        <h2 style="font-size: 21px; font-weight: normal; margin-top: 0;">
            PRÓBY
        </h2>

        <div class="proby" style="
            display: grid;
            grid-template-columns: 180px 1fr;
            gap: 10px;
            align-items: center;
        ">

            <label>Czy możliwe są spóźnienia?</label>

            <div style="display: flex; gap: 15px; flex-wrap: wrap;">

                <label>
                    <input type="radio" name="spoznienia" value="Tak" required>
                    Tak
                </label>

                <label>
                    <input type="radio" name="spoznienia" value="Nie">
                    Nie
                </label>

            </div>

            <label for="termin">Kiedy możesz przychodzić?</label>

            <select id="termin" name="termin" required
                style="width: 100%; padding: 8px; background: transparent;">

                <option value="">(wybierz)</option>
                <option value="Dni robocze">Dni robocze</option>
                <option value="Weekendy">Weekendy</option>
                <option value="Popołudnia">Popołudnia</option>
                <option value="Wieczory">Wieczory</option>
                <option value="Elastycznie">Elastycznie</option>

            </select>

        </div>
    </section>


    <!-- REGULAMIN -->
    <div style="margin-top: 15px;">

        <label>
            <input type="checkbox" id="regulamin" name="regulamin" required>
            Akceptuję regulamin zespołu
        </label>

    </div>


    <!-- PRZYCISKI -->
    <div style="display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-top: 15px;">

        <button type="reset"
            style="padding: 10px 14px; background: transparent; border: 1px solid #555; cursor: pointer;">
            WYCZYŚĆ
        </button>

        <button type="submit"
            style="padding: 10px 14px; background: transparent; border: 1px solid #555; cursor: pointer;">
            WYŚLIJ ZGŁOSZENIE
        </button>

    </div>

    <p style="text-align: center; font-size: 12px; margin-top: 12px;">
        Źródło: Nikodem Rolski
    </p>

</form>


<!-- SPRAWDZANIE WYMAGANYCH ODPOWIEDZI -->
<script>

    const formularz = document.getElementById("formularz");

    const inne = document.getElementById("inne");
    const innePole = document.getElementById("inne-instrumenty");

    // Pole "Jeśli inne, jakie?" jest wymagane tylko po zaznaczeniu "Inne".
    function sprawdzInne() {
        innePole.required = inne.checked;
    }

    inne.addEventListener("change", sprawdzInne);
    sprawdzInne();


    // Sprawdzanie formularza przed wysłaniem.
    formularz.addEventListener("submit", function(event) {

        const instrumenty = document.querySelectorAll(
            'input[name="instrument"]:checked'
        );

        const gatunki = document.querySelectorAll(
            'input[name="gatunek"]:checked'
        );

        const opis = document.getElementById("opis").value.trim();

        if (instrumenty.length === 0) {
            event.preventDefault();
            alert("Zaznacz przynajmniej jeden instrument.");
            return;
        }

        if (gatunki.length === 0) {
            event.preventDefault();
            alert("Zaznacz przynajmniej jeden gatunek muzyczny.");
            return;
        }

        if (opis.length === 0) {
            event.preventDefault();
            alert("Opisz swoje doświadczenie i inspiracje.");
            document.getElementById("opis").focus();
            return;
        }

        // Formularz jest demonstracyjny i nie ma jeszcze serwera.
        event.preventDefault();

        alert(
            "Formularz został poprawnie wypełniony. " +
            "Wysyłanie zgłoszeń na serwer nie jest jeszcze skonfigurowane."
        );

    });

</script>

</body>
</html>
